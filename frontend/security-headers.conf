# Security headers, included at server level and again in every location that sets its own add_header
# (nginx drops inherited add_header directives in a location that declares any of its own).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# No inline or third-party scripts. style-src needs 'unsafe-inline' for the style attributes React/Recharts set;
# fonts are bundled (@fontsource) and served from /assets/.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
