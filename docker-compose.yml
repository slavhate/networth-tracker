services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: networth-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Generate a strong key: python -c "import secrets; print(secrets.token_hex(32))"
      # - SECRET_KEY=   # optional; generate one with: openssl rand -hex 32
      - CREATE_DEMO_DATA=true
      # - DEMO_PASSWORD=   # optional; if unset, a random password is printed in the backend log
      - DATA_FILE=/app/data/data.json
      # - TZ=IST-5:30   # optional: use Indian time for "today" (POSIX form works without tzdata)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: networth-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in nginx:alpine "localhost" resolves to ::1 first, but nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: networth-network
